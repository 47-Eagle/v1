specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # Main Eagle OVault Contract
  - kind: ethereum/contract
    name: EagleOVault
    network: mainnet
    source:
      address: "0x47b3ef629D9cB8DFcF8A6c61058338f4e99d7953"
      abi: EagleOVault
      # Contract creation block (auto-detected via eth_getCode binary search)
      startBlock: 23697538
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultSnapshot
        - Deposit
        - Withdrawal
        - GlobalStats
        - DailySnapshot
      abis:
        - name: EagleOVault
          file: ./abis/EagleOVault.json
        - name: CharmVault
          file: ./abis/CharmVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: DualDeposit(indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleDualDeposit
        - event: Reported(uint256,uint256,uint256,uint256)
          handler: handleReported
        - event: StrategyDeployed(indexed address,uint256,uint256)
          handler: handleStrategyDeployed
        - event: Rebalanced(uint256,uint256)
          handler: handleRebalanced
      file: ./src/mapping.ts

  # USD1/WLFI Strategy
  - kind: ethereum/contract
    name: USD1Strategy
    network: mainnet
    source:
      # V3 strategy (current production)
      address: "0x6c638f745B7adC2873a52De0D732163b32144f0b"
      abi: CharmStrategy
      # Contract creation block (auto-detected via eth_getCode binary search)
      startBlock: 24067676
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CollectFeeEvent
        - Rebalance
      abis:
        - name: CharmStrategy
          file: ./abis/CharmStrategy.json
        - name: CharmVault
          file: ./abis/CharmVault.json
      eventHandlers:
        - event: StrategyDeposit(uint256,uint256,uint256)
          handler: handleStrategyDeposit
        - event: StrategyWithdraw(uint256,uint256,uint256)
          handler: handleStrategyWithdraw
        - event: StrategyRebalanced(uint256,uint256)
          handler: handleStrategyRebalanced
      file: ./src/mapping.ts

  # WETH/WLFI Strategy
  - kind: ethereum/contract
    name: WETHStrategy
    network: mainnet
    source:
      # WETH strategy (current production)
      address: "0x55E78798A926Bac07b4D90f7b1bEc769b72E76A6"
      abi: CharmStrategy
      # Contract creation block (auto-detected via eth_getCode binary search)
      startBlock: 24087850
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CollectFeeEvent
        - Rebalance
      abis:
        - name: CharmStrategy
          file: ./abis/CharmStrategy.json
        - name: CharmVault
          file: ./abis/CharmVault.json
      eventHandlers:
        - event: StrategyDeposit(uint256,uint256,uint256)
          handler: handleStrategyDeposit
        - event: StrategyWithdraw(uint256,uint256,uint256)
          handler: handleStrategyWithdraw
        - event: StrategyRebalanced(uint256,uint256)
          handler: handleStrategyRebalanced
      file: ./src/mapping.ts

templates:
  # Template for USD1/WLFI Charm Vault
  - kind: ethereum/contract
    name: CharmVaultUSD1
    network: mainnet
    source:
      abi: CharmVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CollectFeeEvent
        - VaultSnapshot
      abis:
        - name: CharmVault
          file: ./abis/CharmVault.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256,uint256)
          handler: handleCharmDeposit
        - event: Withdraw(indexed address,uint256,uint256,uint256)
          handler: handleCharmWithdraw
      file: ./src/mapping.ts

  # Template for WETH/WLFI Charm Vault
  - kind: ethereum/contract
    name: CharmVaultWETH
    network: mainnet
    source:
      abi: CharmVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CollectFeeEvent
        - VaultSnapshot
      abis:
        - name: CharmVault
          file: ./abis/CharmVault.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256,uint256)
          handler: handleCharmDeposit
        - event: Withdraw(indexed address,uint256,uint256,uint256)
          handler: handleCharmWithdraw
      file: ./src/mapping.ts

